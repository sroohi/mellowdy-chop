name: Build Samplify for macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Universal macOS app
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure universal Release build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DBUILD_TESTING=ON
      - name: Build app and tests
        run: cmake --build build --config Release --parallel 3
      - name: Run DSP, audio, and session tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Verify universal executable
        run: |
          lipo -verify_arch arm64 x86_64 build/Samplify_artefacts/Release/Samplify.app/Contents/MacOS/Samplify
          plutil -lint build/Samplify_artefacts/Release/Samplify.app/Contents/Info.plist
      - name: Launch native macOS demo and capture UI evidence
        env:
          SAMPLIFY_SMOKE_DIR: ${{ runner.temp }}/samplify-smoke
        run: |
          set -euo pipefail
          if [[ -e "$SAMPLIFY_SMOKE_DIR" ]]; then
            echo "Smoke evidence directory already exists; refusing to reuse stale results." >&2
            exit 1
          fi
          mkdir -p "$SAMPLIFY_SMOKE_DIR"
          /usr/bin/open -n "$PWD/build/Samplify_artefacts/Release/Samplify.app" --args --smoke-test "$SAMPLIFY_SMOKE_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import struct
          import time

          directory = Path(os.environ["SAMPLIFY_SMOKE_DIR"])
          report_path = directory / "smoke.json"
          deadline = time.monotonic() + 75
          report = None
          while time.monotonic() < deadline:
              try:
                  report = json.loads(report_path.read_text())
                  break
              except (FileNotFoundError, json.JSONDecodeError):
                  time.sleep(0.25)
          if report is None:
              raise SystemExit("Native macOS app did not finish its demo smoke test within 75 seconds. Check launch/crash logs and GUI availability.")
          for field in ("macOSRun", "demoAnalysedAndPadsRendered", "screenshotSaved"):
              if report.get(field) is not True:
                  raise SystemExit(f"Native app smoke test failed: {field} was not true: {report}")
          image = (directory / "Samplify.png").read_bytes()
          if len(image) < 24 or image[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Native app did not save a valid PNG screenshot.")
          width, height = struct.unpack(">II", image[16:24])
          if width <= 0 or height <= 0 or (width, height) != (report.get("width"), report.get("height")):
              raise SystemExit(f"Native app screenshot dimensions disagree with report: {width} x {height}: {report}")
          print(f"Native macOS demo analysed audio and rendered pads; saved {width} x {height} UI evidence.")
          PY
      - name: Upload native macOS UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Samplify-native-macOS-smoke
          path: |
            ${{ runner.temp }}/samplify-smoke/Samplify.png
            ${{ runner.temp }}/samplify-smoke/Samplify-compact.png
            ${{ runner.temp }}/samplify-smoke/smoke.json
          if-no-files-found: warn
          retention-days: 30
      - name: Package downloadable development build
        run: ./script/package_macos.sh build
      - name: Upload app, disk image, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Samplify-macOS-universal
          path: |
            dist/Samplify-macOS-universal.zip
            dist/Samplify-macOS-universal.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish downloadable development preview
    needs: macos
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/samplify-native')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated macOS packages
        uses: actions/download-artifact@v4
        with:
          name: Samplify-macOS-universal
          path: dist
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="samplify-v0.1.0-$SHORT_SHA"
          cat > release-notes.md <<'NOTES'
          Standalone Samplify development preview for macOS 12 and later, with universal Apple Silicon and Intel binaries.

          Download the DMG and drag Samplify to Applications, or extract the app ZIP. SHA256SUMS.txt contains checksums for both files.

          This development build is ad-hoc signed. It is not Developer ID signed or notarized. macOS Gatekeeper may require explicit approval in Privacy & Security. Do not disable Gatekeeper globally.

          The build passed automated DSP, audio-rendering, and session tests, then launched the native macOS app, analysed the demo, rendered its pads, and saved UI screenshot evidence. The workflow's Samplify-native-macOS-smoke artifact contains the screenshot and report. Hardware audio, MIDI input, interactive editing, and first-launch trust still require human testing on a Mac. Stem controls use imported separated files; no neural separation model is bundled.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Samplify-macOS-universal.zip dist/Samplify-macOS-universal.dmg dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Samplify 0.1.0 development preview ($SHORT_SHA)" \
              --notes-file release-notes.md \
              --prerelease \
              dist/Samplify-macOS-universal.zip \
              dist/Samplify-macOS-universal.dmg \
              dist/SHA256SUMS.txt
          fi
