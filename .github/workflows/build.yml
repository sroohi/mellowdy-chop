name: Build Samplify for macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Universal macOS app
    runs-on: macos-14
    timeout-minutes: 60
    env:
      SAMPLIFY_STEM_MODEL_FILE: ${{ github.workspace }}/.cache/models/ggml-model-htdemucs-4s-f16.bin
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up build-time model converter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore hash-pinned native stem model
        id: stem-model-cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/models/ggml-model-htdemucs-4s-f16.bin
            .cache/models/ggml-model-htdemucs-4s-f16.bin.json
          key: samplify-htdemucs-72b17c42d308982ddb5069bc3bf48b81a5aac4cb6516e4366c0fa7cef6df0064-${{ hashFiles('script/prepare_stem_model.py') }}
      - name: Install build-time conversion dependencies
        if: steps.stem-model-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import platform
          import sys

          if platform.machine().lower() != "arm64" or sys.version_info[:2] != (3, 12):
              raise SystemExit("First-time model conversion requires an Apple Silicon build host with Python 3.12. The packaged C++ app remains universal.")
          print(f"Build-time model converter: {platform.machine()}, Python {platform.python_version()}")
          PY
          python -m pip install --disable-pip-version-check --only-binary=:all: torch==2.6.0 numpy==2.2.6
      - name: Prepare native model from pinned official checkpoint
        if: steps.stem-model-cache.outputs.cache-hit != 'true'
        run: python script/prepare_stem_model.py --output "$SAMPLIFY_STEM_MODEL_FILE"
      - name: Verify native model checksum
        run: python script/prepare_stem_model.py --verify-only --output "$SAMPLIFY_STEM_MODEL_FILE"
      - name: Configure universal Release build
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DSAMPLIFY_STEM_MODEL_FILE="$SAMPLIFY_STEM_MODEL_FILE"
          -DBUILD_TESTING=ON
      - name: Build app and tests
        run: cmake --build build --config Release --parallel 2
      - name: Verify all required test suites are registered
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          listing = subprocess.run(["ctest", "--test-dir", "build", "--build-config", "Release", "--show-only=json-v1"], check=True, capture_output=True, text=True)
          suites = {test["name"] for test in json.loads(listing.stdout)["tests"]}
          required = {"SamplifyCoreTests", "SamplifyCueEditingTests", "SamplifyMetadataTests", "SamplifyStretchTests", "SamplifyStemTests", "SamplifyIntegrationTests"}
          if not required <= suites:
              raise SystemExit(f"Required test suites are missing: {sorted(required - suites)}")
          print("Required suites registered: " + ", ".join(sorted(required)))
          PY
      - name: Run cue editing, metadata, Rubber Band, neural stems, audio, and session tests
        run: ctest --test-dir build --build-config Release --timeout 900 --output-on-failure
      - name: Verify universal executable
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          binary = Path("build/Samplify_artefacts/Release/Samplify.app/Contents/MacOS/Samplify")
          result = subprocess.run(["/usr/bin/lipo", "-archs", str(binary)], check=True, capture_output=True, text=True)
          architectures = set(result.stdout.split())
          print(f"Native executable: {binary}")
          print(f"Native executable architectures: {result.stdout.strip()}")
          missing = {"arm64", "x86_64"} - architectures
          if missing:
              raise SystemExit(f"Universal executable is missing architectures: {sorted(missing)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Universal app architectures verified: {', '.join(sorted(architectures))}.\n")
          PY
          plutil -lint build/Samplify_artefacts/Release/Samplify.app/Contents/Info.plist
      - name: Launch native macOS demo and capture UI evidence
        env:
          SAMPLIFY_SMOKE_DIR: ${{ runner.temp }}/samplify-smoke
        run: |
          set -euo pipefail
          if [[ -e "$SAMPLIFY_SMOKE_DIR" ]]; then
            echo "Smoke evidence directory already exists; refusing to reuse stale results." >&2
            exit 1
          fi
          mkdir -p "$SAMPLIFY_SMOKE_DIR"
          /usr/bin/open -n "$PWD/build/Samplify_artefacts/Release/Samplify.app" --args --smoke-test "$SAMPLIFY_SMOKE_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import struct
          import time

          def annotation_text(message):
              return str(message).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def fail(message):
              message = str(message)[:4000]
              print("::error title=Native macOS smoke::" + annotation_text(message), flush=True)
              raise SystemExit(message)

          directory = Path(os.environ["SAMPLIFY_SMOKE_DIR"])
          report_path = directory / "smoke.json"
          deadline = time.monotonic() + 270
          report = None
          while time.monotonic() < deadline:
              try:
                  report = json.loads(report_path.read_text())
                  break
              except (FileNotFoundError, json.JSONDecodeError):
                  time.sleep(0.25)
              except OSError as error:
                  fail(f"Could not read native smoke report: {error}")
          if report is None:
              fail("Native macOS app did not finish its controller and neural-stem smoke test within 270 seconds. Check launch/crash logs and GUI availability.")
          if not isinstance(report, dict):
              fail("Native macOS smoke report must be a JSON object.")
          public_report = dict(report)
          public_report["error"] = str(report.get("error", ""))[:2000]
          report_json = json.dumps(public_report, sort_keys=True, ensure_ascii=True)
          print("::notice title=Native macOS smoke report::" + annotation_text(report_json), flush=True)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as summary:
                  summary.write("### Native macOS controller and stem report\n\n```json\n" + report_json + "\n```\n")
          for field in ("macOSRun", "demoAnalysedAndPadsRendered", "screenshotSaved", "blankScreenshotSaved", "stemSeparationCompleted"):
              if report.get(field) is not True:
                  fail(f"Native app smoke test failed: {field} was not true. App error: {public_report['error']}")
          for group, minimum in (("workflowChecks", 10), ("stemWorkflowChecks", 1)):
              checks = report.get(group)
              if not isinstance(checks, dict) or len(checks) < minimum:
                  fail(f"Native app smoke report requires at least {minimum} named boolean checks in {group}.")
              failed = [name for name, passed in checks.items() if passed is not True]
              if failed:
                  fail(f"Native app controller checks failed in {group}: {failed}")
              print(f"Passed {len(checks)} native controller checks in {group}: {', '.join(sorted(checks))}")
          for filename in ("Samplify.png", "Samplify-empty.png", "Samplify-compact.png"):
              try:
                  image = (directory / filename).read_bytes()
              except OSError as error:
                  fail(f"Native app screenshot missing or unreadable: {filename}: {error}")
              if len(image) < 24 or image[:8] != b"\x89PNG\r\n\x1a\n":
                  fail(f"Native app did not save a valid PNG screenshot: {filename}")
              width, height = struct.unpack(">II", image[16:24])
              if width <= 0 or height <= 0:
                  fail(f"Native app screenshot has invalid dimensions: {filename}")
              if filename == "Samplify.png" and (width, height) != (report.get("width"), report.get("height")):
                  fail(f"Native app screenshot dimensions disagree with report: {width} x {height}, expected {report.get('width')} x {report.get('height')}")
              print(f"Native macOS UI evidence: {filename}, {width} x {height}.")
          PY
      - name: Upload native macOS UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Samplify-native-macOS-smoke
          path: |
            ${{ runner.temp }}/samplify-smoke/Samplify.png
            ${{ runner.temp }}/samplify-smoke/Samplify-empty.png
            ${{ runner.temp }}/samplify-smoke/Samplify-compact.png
            ${{ runner.temp }}/samplify-smoke/smoke.json
          if-no-files-found: warn
          retention-days: 30
      - name: Package downloadable development build
        run: ./script/package_macos.sh build
      - name: Upload app, disk image, and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Samplify-macOS-universal
          path: |
            dist/Samplify-macOS-universal.zip
            dist/Samplify-macOS-universal.dmg
            dist/SHA256SUMS.txt
            dist/ggml-model-htdemucs-4s-f16.bin
            dist/HTDemucs-model-provenance.json
            dist/HTDemucs-MIT.txt
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish downloadable development preview
    needs: macos
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/samplify-native')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated macOS packages
        uses: actions/download-artifact@v4
        with:
          name: Samplify-macOS-universal
          path: dist
      - name: Download native UI validation evidence
        uses: actions/download-artifact@v4
        with:
          name: Samplify-native-macOS-smoke
          path: dist/native-smoke
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="samplify-v0.2.0-$SHORT_SHA"
          cat > release-notes.md <<'NOTES'
          Samplify 0.2.0 standalone development preview for macOS 12 and later, with universal Apple Silicon and Intel binaries. Its sampling workflow is informed by the Serato Sample 2.x manual; this independent app does not include Serato's proprietary processing or claim exact parity.

          Download the DMG and drag Samplify to Applications, or extract the app ZIP. The native four-stem HTDemucs model is bundled, and the app does not need Python, a separate model download, or an online account at runtime. Rubber Band supplies independent native pitch/time processing. SHA256SUMS.txt contains package and standalone-model checksums.

          This development build is ad-hoc signed. It is not Developer ID signed or notarized. macOS Gatekeeper may require explicit approval in Privacy & Security. Do not disable Gatekeeper globally.

          The build passed core DSP, cue editing, metadata, Rubber Band, actual neural-stem inference, audio-rendering, and session test suites. It then launched the native macOS app, checked its empty load screen, exercised controller workflows, completed neural stem separation through the UI, and captured full/compact UI screenshots plus a checked JSON report. Samplify.png, Samplify-empty.png, Samplify-compact.png, and smoke.json provide the native evidence. These checks do not establish exact Serato parity. Hardware audio, MIDI input, musical quality, remaining interactive acceptance, and first-launch trust still require human testing on a Mac.

          The separate ggml-model-htdemucs-4s-f16.bin asset supports source builds without PyTorch conversion, including on Intel Macs. Preserve its accompanying HTDemucs-model-provenance.json and HTDemucs-MIT.txt notices. Normal app users already have this model inside the app bundle.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Samplify-macOS-universal.zip dist/Samplify-macOS-universal.dmg dist/SHA256SUMS.txt dist/ggml-model-htdemucs-4s-f16.bin dist/HTDemucs-model-provenance.json dist/HTDemucs-MIT.txt dist/native-smoke/Samplify.png dist/native-smoke/Samplify-empty.png dist/native-smoke/Samplify-compact.png dist/native-smoke/smoke.json --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Samplify 0.2.0 development preview ($SHORT_SHA)" \
              --notes-file release-notes.md \
              --prerelease \
              dist/Samplify-macOS-universal.zip \
              dist/Samplify-macOS-universal.dmg \
              dist/SHA256SUMS.txt \
              dist/ggml-model-htdemucs-4s-f16.bin \
              dist/HTDemucs-model-provenance.json \
              dist/HTDemucs-MIT.txt \
              dist/native-smoke/Samplify.png \
              dist/native-smoke/Samplify-empty.png \
              dist/native-smoke/Samplify-compact.png \
              dist/native-smoke/smoke.json
          fi
